# A workspace since #948: today's code lives in crates/contexere-reduce, and the
# binary below depends on it, so later crates (a daemon, a credential broker) sit
# beside it instead of growing one crate. Both are default members, so a plain
# `cargo test` or `cargo clippy` still covers everything.
[workspace]
members = ["crates/contexere-reduce"]
default-members = [".", "crates/contexere-reduce"]
resolver = "3"

# Read by scripts/bump_version.sh and omni-release.sh as the first `version =` line.
[workspace.package]
version = "0.8.4"
edition = "2024"
authors = ["Fajar Hidayat"]
license = "Apache-2.0"
homepage = "https://omni.weekndlabs.com"
repository = "https://github.com/fajarhide/contexere"

[package]
name = "contexere"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
# No ratio here on purpose. A crates.io description cannot carry the window and the
# population a savings figure is only true inside, and the last two ratios that
# shipped without them (58.9% here, 89% in the repo description) both descend from a
# corpus that seven-day pruning has since deleted. The reproducible numbers live in
# the manual's benchmarks page next to the command that regenerates them.
description = "The context layer for AI coding agents: less noise, fewer tokens, nothing lost. Formerly OMNI."
readme = "README.md"
# crates.io takes at most five keywords and only its own category slugs.
keywords = ["ai", "agent", "mcp", "cli", "llm"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# What crates.io packages; the rest of the repository is docs, fixtures and media.
include = ["src/**/*.rs", "README.md", "LICENSE", "NOTICE"]

# `omni` is not a second target: installers link it to this binary (#876).
[[bin]]
name = "contexere"
path = "src/main.rs"

[dependencies]
# The version is what crates.io resolves; bump_version.sh keeps it equal to ours.
contexere = { package = "contexere-reduce", path = "crates/contexere-reduce", version = "0.8.4" }
colored = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
# Only to restore default SIGPIPE (#155).
libc = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
regex = "1"
walkdir = "2"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
insta = "1"
# Exact token counting for tests/bench_replay.rs only (#392). Deliberately NOT a
# runtime dependency: #174 removed cl100k counting from the hook after measuring
# it at 34.3 ms against a 10 ms budget. The benchmark has no such budget, and a
# published token figure that came from a bytes divisor is not a token figure.
tiktoken-rs = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile `make ci` builds, and the only difference from release is that
# codegen is allowed to use the other seven cores. `codegen-units = 1` costs 355s
# to rebuild this one crate against 89s at 16, measured back to back on the same
# machine, and it is 4 minutes every developer pays on every gate round.
#
# What it buys, also measured: 9,941,888 bytes against 11,466,880, so the gate
# binary runs 15.3% larger than the one users get. The size check stays at 15 MB
# and is therefore a tighter gate here than on the real artifact, not a looser
# one, which is the direction a proxy is allowed to be wrong in.
#
# Nothing ships from this profile. `release.yml` builds
# `cargo build --release --target <triple>` itself and never calls `make`.
[profile.ci]
inherits = "release"
codegen-units = 16
