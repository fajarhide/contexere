name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: make ci (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned rather than `stable`. `rust-toolchain.toml` pins 1.99.1, so asking
      # for `stable` made rustup fetch a second toolchain that was then never
      # used. Keep this in step with the pin, the way `release.yml` has to (#179).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Prebuilt binaries. `cargo install --locked` compiled both of these from
      # source on every run, minutes of a 13 minute job spent rebuilding tools
      # that publish releases (#179).
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-insta,cargo-audit

      - name: Run canonical CI pipeline
        run: make ci

  test-matrix:
    name: cargo test (${{ matrix.os }})
    # Deliberately not `needs: ci`. Serialising behind ubuntu made the wall clock
    # the sum of the two jobs, 13 minutes plus 10, for work that is independent:
    # the matrix compiles and tests on macOS and Windows and shares nothing with
    # the lint, audit and smoke checks on ubuntu. It costs more runner minutes on
    # a red build and returns the answer in roughly half the time (#179).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run tests
        run: cargo test --all

  plugin-pi:
    name: typecheck (plugins/pi)
    # Not `needs: ci`, for the same reason the matrix is not: it shares nothing
    # with the Rust jobs and serialising it would only add its wall clock to
    # theirs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/pi/package-lock.json

      # `npm ci` rather than `npm install`, so a dependency bump is typechecked
      # against the lockfile the PR proposes rather than against whatever
      # resolves today.
      - name: Install
        working-directory: plugins/pi
        run: npm ci

      - name: Typecheck
        working-directory: plugins/pi
        run: npm run typecheck

  plugin-openclaw:
    name: typecheck (plugins/openclaw)
    # Nothing in this file had ever compiled the OpenClaw plugin, and it did not
    # compile: a TypeBox object where the host wants a JSON Schema, a tool cast
    # to a factory, and an errno string typed as a number. All three were
    # assertions hiding a mismatch with the real SDK, which is the shape #628 is
    # about. `openclaw` is a devDependency so this checks against the host's own
    # types rather than a hand-copied stub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/openclaw/package-lock.json

      - name: Install
        working-directory: plugins/openclaw
        run: npm ci

      - name: Typecheck
        working-directory: plugins/openclaw
        run: npm run typecheck

  plugin-hermes:
    name: checks (plugins/hermes)
    # The plugin used to be a Rust raw string, so no job in this file could see
    # that every copy OMNI installed was a Python syntax error (#628). It is a
    # real file now and this is the job that compiles it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile plugins/hermes/__init__.py

      - name: Checks
        run: python plugins/hermes/test_plugin.py

  manual-translations:
    name: manual translations in step
    # Seconds of git, so it runs on its own rather than behind thirteen minutes
    # of Rust. Pull requests only: the check compares a branch against its merge
    # base, and on a push to main there is no branch to compare.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge base is not in a shallow clone, and without it the script
          # would see the whole manual as changed on every run.
          fetch-depth: 0

      - name: English pages changed without their translation
        run: scripts/check_translations.sh "origin/${{ github.base_ref }}"
