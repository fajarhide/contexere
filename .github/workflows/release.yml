name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: contexere
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: contexere
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: contexere
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: contexere
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: contexere.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The toolchain used to be chosen by the ref (`@stable`). Pinning the
      # action to a SHA means the version has to be named, and naming it is the
      # honest form anyway: `rust-toolchain.toml` pins 1.99.1 and rustup prefers
      # that file, so `@stable` fetched a whole toolchain that was then never
      # used, and the two could drift apart without anything saying so (#179).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (Linux)
        if: runner.os == 'Linux'
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release"

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cd dist
          # Since 0.9.0 the archive holds `contexere` alone and no `omni-*` copy ships
          # (#1067); 0.8.x shipped both for hooks and installers still on the old name.
          base=contexere-${{ github.ref_name }}-${{ matrix.target }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            ext=zip
            7z a $base.$ext ${{ matrix.binary }}
          else
            ext=tar.gz
            tar czf $base.$ext ${{ matrix.binary }}
          fi
          sha256sum $base.$ext > $base.$ext.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contexere-${{ matrix.target }}
          path: |
            dist/contexere-${{ github.ref_name }}-${{ matrix.target }}.*

  # The desktop app (#1176, #1188), built the way `desktop.yml` builds it on every
  # PR. Unsigned on macOS: the release notes say how to open it.
  desktop:
    name: Desktop ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Webview libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build
        run: |
          npm ci
          npm run icons
          npx tauri build

      - name: Package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tag=${{ github.ref_name }}
          b=src-tauri/target/release/bundle
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp $b/dmg/*.dmg "$GITHUB_WORKSPACE/dist/contexere-desktop-$tag-aarch64-apple-darwin.dmg"
          else
            cp $b/deb/*.deb "$GITHUB_WORKSPACE/dist/contexere-desktop-$tag-amd64.deb"
            cp $b/appimage/*.AppImage "$GITHUB_WORKSPACE/dist/contexere-desktop-$tag-x86_64.AppImage"
          fi
          cd "$GITHUB_WORKSPACE/dist"
          for f in contexere-desktop-*; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contexere-desktop-${{ runner.os }}
          path: dist/contexere-desktop-*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    # `id-token` and `attestations` are what let this job sign a statement that
    # these bytes came from this workflow at this commit. `SHA256SUMS` only says
    # a file has not changed since it was published; it cannot say who published
    # it, which is the question that matters for a binary sitting in the hook
    # path of every command a developer runs (#632).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.sha256' \) -exec cp {} release/ \;

          echo "=== Release files ==="
          ls -la release/

          # Generate combined SHA256SUMS
          cd release
          cat *.sha256 > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*.dmg
            release/*.deb
            release/*.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.dmg
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
