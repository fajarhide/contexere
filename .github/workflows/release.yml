name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: contexere
            legacy: omni
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: contexere
            legacy: omni
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: contexere
            legacy: omni
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: contexere
            legacy: omni
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: contexere.exe
            legacy: omni.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The toolchain used to be chosen by the ref (`@stable`). Pinning the
      # action to a SHA means the version has to be named, and naming it is the
      # honest form anyway: `rust-toolchain.toml` pins 1.99.1 and rustup prefers
      # that file, so `@stable` fetched a whole toolchain that was then never
      # used, and the two could drift apart without anything saying so (#179).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release (Linux)
        if: runner.os == 'Linux'
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release"

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cd dist
          # The archive keeps its omni-* name and an `omni` entry beside `contexere`, so
          # install.sh fetched from an older main, and every hook that calls `omni`,
          # still find what they expect after the rename (#876).
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp ${{ matrix.binary }} ${{ matrix.legacy }}
            7z a omni-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.binary }} ${{ matrix.legacy }}
            sha256sum omni-${{ github.ref_name }}-${{ matrix.target }}.zip > omni-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256
          else
            ln ${{ matrix.binary }} ${{ matrix.legacy }}
            tar czf omni-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.binary }} ${{ matrix.legacy }}
            sha256sum omni-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > omni-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: omni-${{ matrix.target }}
          path: dist/omni-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # `id-token` and `attestations` are what let this job sign a statement that
    # these bytes came from this workflow at this commit. `SHA256SUMS` only says
    # a file has not changed since it was published; it cannot say who published
    # it, which is the question that matters for a binary sitting in the hook
    # path of every command a developer runs (#632).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} release/ \;

          echo "=== Release files ==="
          ls -la release/

          # Generate combined SHA256SUMS
          cd release
          cat *.sha256 > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
