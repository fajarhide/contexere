[package]
name = "contexere-reduce"
description = "The reduction pipeline behind Contexere: distillers, the ledger, redaction and the hooks that run them."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
build = "build.rs"
readme = "../../README.md"
keywords = ["ai", "agent", "mcp", "llm", "redaction"]
categories = ["development-tools", "text-processing"]
include = ["src/**/*.rs", "build.rs", "assets/**"]

# The crate keeps the name `contexere` so every `contexere::` path in tests and
# examples reads the same after the workspace split (#948).
[lib]
name = "contexere"
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
# Only to restore default SIGPIPE (#155). Already in the tree via rusqlite, so
# this adds no compilation, it just makes the use direct.
libc = "0.2"

[dependencies]
# Core
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# MCP Server  
rmcp = { version = "2.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Database (SQLite bundled — no system dep)
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Observability

# Pattern matching
regex = "1"

# Security & hashing
sha2 = "0.10"

# Time & analytics
chrono = "0.4"

# File system
dirs = "5"
walkdir = "2"

# Output formatting
colored = "2"

# Config (TOML DSL filters)
toml = "0.8"

# Misc
ureq = { version = "2", features = ["json"] }
strsim = "0.11"
schemars = "1.2.1"
unicode-width = "0.2.2"
dialoguer = "0.11"

[dev-dependencies]
insta = "1"  # snapshot testing
tempfile = "3"

